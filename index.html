html: `
<div class="disc">Criterio operativo: <strong>sin documento legible = no vacunado</strong>. El relato verbal no cuenta. Dosis escritas válidas si respetan edad mínima e intervalo mínimo; <strong>nunca se reinicia</strong> una pauta documentada. Priorizar combinadas y coadministración. Fuentes: estrategia CSP/Ministerio 16/06/2026; infografía de migrantes; calendario acelerado CISNS; cap. 11–12 CAV-AEP (ago-2026); protocolo refugiados Asturias 2023.</div>
<div class="card">
  <h3>Reglas de consulta</h3>
  <ul>
    <li>Validar cartilla. Dudosa o ilegible → vacunar.</li>
    <li>No retrasar por serologías, salvo excepciones: <strong>HA y HB</strong> si procede de zona de alta endemia; <strong>varicela ≥18 años</strong> (estrategia 2026). Evitar retrasos por el resto.</li>
    <li>Sospecha de ID o VIH no tratado: inactivadas pronto; vivas diferidas hasta valoración.</li>
    <li>Gestante: derivar a AP/matrona; Tdpa + gripe de campaña; no vivas.</li>
    <li>Registrar identidad (idealmente NIE) para trazabilidad. Calendarios de origen: immunizationdata.who.int.</li>
    <li>Llegada reciente (Programa de Atención Humanitaria): 1.ª dosis de prioritarias en las <strong>3 primeras semanas</strong>.</li>

</div>

  <p><span class="tag">SRP / TV</span> <span class="tag">VPI</span> <span class="tag">Td o Tdpa</span></p>
  <p>Al menos 1 dosis de cada una si no hay registro. Completar con pauta acelerada si la estancia se prolonga. En &lt;5 años en convivencia colectiva, si no consta protección frente a HA: valorar hepatitis A (estrategia 2026).</p>

  <h3>Principio</h3>
  <p>Individualizar según fármaco, dosis, tiempo y enfermedad de base. Lo siguiente es marco habitual CAV-AEP / programas de vacunación, no un protocolo único por principio activo.</p>
  <ul>
    <li><strong>Vivas</strong> (SRP, varicela, rotavirus, gripe nasal): en general CI si inmunosupresión intensa. Si es posible, administrar semanas-meses <em>antes</em> de iniciar el tratamiento.</li>
    <li>Inactivadas, conjugadas, recombinantes, ARNm, toxoides: no CI por ser vivas; la respuesta puede ser subóptima. Preferible ≥2 semanas antes o en valle de inmunosupresión.</li>
  </ul>
</div>
<div class="card">

html: `

function parseDob(raw) {
  if (!raw) return null;
  const s = raw.trim();
  let d, mo, y;
  const dmY = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  const ymd = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (dmY) { d = +dmY[1]; mo = +dmY[2]; y = +dmY[3]; }
  else if (ymd) { y = +ymd[1]; mo = +ymd[2]; d = +ymd[3]; }
  else return null;
  if (mo < 1 || mo > 12 || d < 1 || d > 31 || y < 1900 || y > 2100) return null;
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return dt;
}
function ageMonths(dt) {
  const n = new Date();
  let m = (n.getFullYear() - dt.getFullYear()) * 12 + (n.getMonth() - dt.getMonth());
  if (n.getDate() < dt.getDate()) m--;
  return m;
}
function ymd(dt) {
  const z = n => String(n).padStart(2, "0");
  return `${dt.getFullYear()}-${z(dt.getMonth()+1)}-${z(dt.getDate())}`;
}
function cohortNow(dt, years) {
  const iso = ymd(dt);
  const menB = iso >= "2022-11-01";
  const rv = iso >= "2025-01-01";
  // MenACWY adolescente en Asturias: sistemática a los 13 desde 01/06/2019;
  // barrido 2020 a 15–18 a = nacidos 2002–2005. Nacidos <2002 no pasaron por esa dosis.
  const men4Cohort = iso >= "2002-01-01";
  const men4StillCatch = years <= 18 && men4Cohort;
  const vphCatch = years <= 18;
  const items = [];
  if (years < 14) {
    items.push("Niño/adolescente: usar Bolsillo 0–18 + cartilla. No inventar dosis que su cohorte no tenía.");
    if (!menB) items.push("MenB infantil: solo cohorte ≥01/11/2022. Si nació antes, no es «dosis atrasada» del anexo.");
    if (!rv) items.push("Rotavirus: solo cohorte ≥01/01/2025 y dentro de la ventana de edad.");
    if (men4StillCatch) items.push("MenACWY: si no consta dosis ≥10 a, el anexo/rescate adolescente llega hasta los 18 a.");
    else if (years >= 13 && !men4Cohort) items.push("MenACWY a los 13: su cohorte no la tenía. Hoy no se pone solo por «faltarme la de los 13».");
    if (vphCatch) items.push("VPH: 1 dosis si no consta (ID: 3 dosis).");
    return items;
  }
  items.push("Td: verificar y completar hasta 5 dosis vitales. Tdpa al menos 1 vez en la vida adulta / cada gestación.");
  if (iso >= "1978-01-01") items.push("SRP: 2 dosis si nacido en ES ≥1978 sin pauta (o 1 si ya consta una). Sin documento: vacunar.");
  items.push("Varicela: si no hay evidencia, serología; 2 dosis si negativa.");
  if (vphCatch) items.push("VPH: rescate 1 dosis hasta 18 a. ID: 3 dosis.");
  else items.push("VPH: el anexo no rescata >18 a. HSH / trabajo sexual / ID: pestaña Fuera de anexo e Inmunosupresión (hasta 45 a en riesgo CISNS; confirmar SESPA).");
  if (men4StillCatch) items.push("MenACWY: 1 dosis si no consta y tiene ≤18 a (cohorte del programa adolescente).");
  else items.push("MenACWY: no se indica en adulto sano solo porque no la recibió a los 13 (esa dosis existe en Asturias desde 2019; barrido 15–18 a en 2020 = nacidos 2002–2005). Hoy: viaje, Hajj, asplenia, complemento, brote o ID — no por edad 34.");
  items.push("Gripe: desde 60 a, o antes si riesgo / campaña. COVID: circular.");
  if (years >= 18) items.push("HZ: 65 y 80 en anexo; ID o anti-JAK desde 18 a; ≥2 brotes: ver Adulto.");
  return items;
}
function listadoItems(dt, years, escenario) {
  const iso = ymd(dt);
  if (escenario === "sanitario") {
    return [
      "Gripe: 1 dosis anual de campaña (incluye estudiantes en prácticas).",
      "Hepatitis B: 3 dosis 0-1-6 si no consta. Serología 1-2 meses tras la 3.ª. Anti-HBs ≥10 = respondedor, no recuerdos. Si <10: otra pauta de 3. Si sigue <10: no más dosis.",
      "Td / Tdpa: completar hasta 5 dosis. Al menos 1 Tdpa en la vida adulta.",
      "SRP: 2 dosis (o 1 si ya hay una) si no consta. Nacidos ES ≥1978 sin pauta. No si gestante o ID intensa.",
      "Varicela: 2 dosis si no hay evidencia. Serología si duda.",
      "COVID-19: según circular del año.",
      "No por ser sanitario: VPH, MenACWY, VNC, HZ (siguen anexo / riesgo).",
      "Solo si procede: HA (laboratorio / hepatopatía), MenACWY±MenB (asplenia, complemento), VPI de laboratorio."
    ];
  }
  if (escenario === "migrante") {
    const items = ["Regla: sin documento legible = no vacunado. No reiniciar pauta documentada.", "1.ª visita prioritaria: al menos SRP + VPI + Td/Tdpa."];
    if (years < 7) items.push("Completar hexa o equivalentes, VNC, MenACWY, SRP ≥12 m, varicela ≥12 m. RV solo si cohorte y ventana. MenB solo ≥01/11/2022.");
    else if (years <= 18) items.push("Tdpa + VPI; SRP 2 dosis; varicela 2 dosis si no evidencia; VPH 1 dosis (ID: 3); MenACWY si ≤18.");
    else items.push("Td hasta 5 dosis. SRP 2 dosis. Varicela: serología. HB/HA según origen. VPH no del anexo. VNC si crónico o ≥86.");
    return items;
  }
  if (escenario === "id") {
    return [
      "Vivas (SRP, varicela, RV, gripe nasal, VPO, FA, BCG): CI si IS intensa. Ideal ≥4 sem. antes de iniciar IS.",
      "Inactivadas, conjugadas, recombinantes, ARNm, toxoides: sí (respuesta puede ser menor). Preferible ≥2 sem. antes.",
      "VPH: siempre 3 dosis 0-2-6 desde los 9 a. No 1 dosis.",
      "VNC: pauta de riesgo, no la del sano. Hib rescate ≥5 a si asplenia, complemento, VIH, eculizumab.",
      "HB: serología; si anti-HBs <10, no respondedor / pauta reforzada.",
      "Shingrix usable en ID. Anti-JAK: desde los 18 a (2 dosis).",
      "Gripe anual inactivada (no LAIV). COVID según circular de ID. Nirsevimab si <2 a de alto riesgo.",
      "Convivientes: gripe, SRP y varicela al día.",
      "Tras suspender IS: vivas en general 3-6 meses (más si TPH, rituximab, Ig alta dosis)."
    ];
  }
  return cohortNow(dt, years);
}
function printListado() {
  const raw = (document.getElementById("dob") || {}).value || "";
  const escenario = (document.getElementById("escenario") || {}).value || "normal";
  const dt = parseDob(raw);
  if (!dt) { alert("Fecha no válida. Use dd/mm/aaaa."); return; }
  const m = ageMonths(dt);
  if (m < 0) { alert("Fecha posterior a hoy."); return; }
  const years = Math.floor(m / 12);
  const rem = m % 12;
  const labels = { normal: "Calendario / fecha de nacimiento", migrante: "Migrante o sin cartilla", id: "Inmunodeprimido", sanitario: "Personal sanitario" };
  const items = listadoItems(dt, years, escenario).map(t => "<li>" + t + "</li>").join("");
  const w = window.open("", "_blank");
  if (!w) { alert("Permita ventanas emergentes para generar el listado."); return; }
  w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Listado VacunAsturias</title>
    <style>body{font:11pt system-ui,sans-serif;margin:16mm;color:#16323d}h1{color:#0b4f6c;font-size:16pt}ul{padding-left:1.1em}li{margin:.35em 0}.note{background:#fff6e8;padding:.6em;border-radius:6px;margin-top:1em;font-size:9pt}</style></head>
    <body><h1>VacunAsturias · ${labels[escenario]}</h1>

    <script>window.onload=function(){window.print()}<\/script></body></html>`);
  w.document.close();
}
function renderAge(raw) {
  const box = document.getElementById("ageResult");
  if (!box) return;
  if (!raw || !String(raw).trim()) { box.innerHTML = ""; return; }
  const dt = parseDob(raw);
  if (!dt) { box.innerHTML = "<p>Fecha no válida. Use <strong>dd/mm/aaaa</strong> (ejemplo: 07/03/2018).</p>"; return; }
  const m = ageMonths(dt);
  if (m < 0) { box.innerHTML = "<p>Fecha posterior a hoy. Revise día/mes/año.</p>"; return; }
  const years = Math.floor(m / 12);
  const rem = m % 12;
  const next = MILESTONES.filter(x => x.months > m).slice(0, 3);
  const last = [...MILESTONES].reverse().find(x => x.months <= m);
  let html = `<p><strong>Edad:</strong> ${years} a + ${rem} m (${m} meses). Nacido ${ymd(dt)}.</p>`;
  html += `<div class="note" style="margin-top:.5rem">El anexo de 2025 no se aplica hacia atrás. «13 años = Tdpa + MenACWY» es lo que se pone <em>ahora</em> a quien cumple 13, no lo que recibió quien cumplió 13 en 2005.</div>`;
  if (last) {
    html += `<p style="margin-top:.45rem"><strong>Último hito del anexo <em>actual</em> (referencia, no cartilla):</strong> ${last.label} — ${last.v}</p>`;
  }
  html += "<p style='margin-top:.45rem'><strong>Qué mirar hoy en esta persona</strong> (no es una orden de vacunar):</p><ul>";
  cohortNow(dt, years).forEach(t => { html += `<li>${t}</li>`; });
  html += "</ul>";
  if (next.length) {
    html += "<p class='muted' style='margin-top:.45rem'><strong>Próximas edades del anexo 2025</strong> (para quien las viva a partir de ahora):</p><ul>";
    next.forEach(x => { html += `<li>${x.label}: ${x.v}</li>`; });
    html += "</ul>";
  }
  html += `<p class="muted" style="margin-top:.4rem">Confrontar HCE. Cohortes infantiles: MenB ≥01/11/2022; RV ≥01/01/2025; VNC20 desde 02/05/2024.</p>`;
  box.innerHTML = html;
}

function renderCatalog(filter, group) {
  const q = (filter || "").toLowerCase();
  let list = VACCINES.filter(v => !group || group === "todas" || v.g === group);
  if (q.length > 1) list = list.filter(v => (v.n + v.prot + v.marcas + v.ast + v.tipo).toLowerCase().includes(q));
  const chips = [["todas","Todas"],["infantil","Lactante/niño"],["adolescente","Adolescente"],["adulto","Adulto"],["campana","Campaña"],["viaje","No sistemática"]]
    .map(([k,l]) => `<button type="button" data-g="${k}" class="${(!group||group==="todas"?k==="todas":group===k)?"on":""}">${l}</button>`).join("");
  let html = `<h2>Fichas de apoyo (no sustituyen CIMA)</h2>
    <div class="disc">EA/CI resumidos de ficha y CAV-AEP. Coste usuario en indicación financiada = 0 €. Verificar lote del centro y PVP si hay prescripción privada.</div>
    <div class="chips" id="vchips">${chips}</div>`;
  html += list.length ? list.map(vacCard).join("") : `<div class="card">Sin coincidencias.</div>`;
  document.getElementById("out").innerHTML = html;
  document.getElementById("vchips").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (b && b.dataset.g) renderCatalog(document.getElementById("q").value.trim(), b.dataset.g);
  });
  bindGlossary(document.getElementById("out"));
}

    const tmp = document.createElement("div");
    tmp.innerHTML = s.html;
    const cards = [...tmp.querySelectorAll(".card")].filter(c => c.textContent.toLowerCase().includes(filter.toLowerCase()));
    if (!cards.length && !s.title.toLowerCase().includes(filter.toLowerCase())) {
      html = `<h2>${s.title}</h2><div class="card">Sin coincidencias para «${filter}».</div>`;
    } else if (cards.length) html = `<h2>${s.title}</h2>` + cards.map(c => c.outerHTML).join("");
  }
  document.getElementById("out").innerHTML = html;
  const dob = document.getElementById("dob");
  if (dob) {
    dob.addEventListener("input", () => {
      let v = dob.value.replace(/[^\d]/g, "");
      if (v.length > 8) v = v.slice(0, 8);
      if (v.length >= 5) v = v.slice(0, 2) + "/" + v.slice(2, 4) + "/" + v.slice(4);
      else if (v.length >= 3) v = v.slice(0, 2) + "/" + v.slice(2);
      if (dob.value !== v) dob.value = v;
      renderAge(dob.value);
    });
    dob.addEventListener("change", () => renderAge(dob.value));
    if (dob.value) renderAge(dob.value);
    const btnL = document.getElementById("btnListado");
    if (btnL) btnL.addEventListener("click", printListado);
  }
  bindGlossary(document.getElementById("out"));
  bindPocket(document.getElementById("out"));
}
function bindPocket(root) {
  if (!root) return;
  root.querySelectorAll(".print-pocket").forEach(btn => {
    btn.addEventListener("click", () => window.print());
  });
  const det = root.querySelector(".age-detail");
  root.querySelectorAll("tr.age-row").forEach(tr => {
    tr.addEventListener("click", e => {
      if (e.target.closest(".abbr")) return;
      const on = tr.classList.contains("on");
      root.querySelectorAll("tr.age-row.on").forEach(x => x.classList.remove("on"));
      if (det) det.classList.remove("on");
      if (!on) {
        tr.classList.add("on");
        if (det) { det.textContent = tr.dataset.d || ""; det.classList.add("on"); }
      }
    });
  });
}

function bindGlossary(root) {
  if (!root) return;
  const keys = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
  const re = new RegExp("(?<![\\wÁÉÍÓÚáéíóú])(" + keys.map(k => k.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\$&")).join("|") + ")(?![\\wÁÉÍÓÚáéíóú])", "g");
  const skip = new Set(["SCRIPT","STYLE","TEXTAREA","INPUT","BUTTON"]);
  const walk = (node) => {
    if (node.nodeType === 1) {
      if (skip.has(node.tagName) || node.classList.contains("abbr")) return;
      [...node.childNodes].forEach(walk);
    } else if (node.nodeType === 3) {
      const t = node.nodeValue;
      if (!re.test(t)) { re.lastIndex = 0; return; }
      re.lastIndex = 0;
      const wrap = document.createElement("span");
      wrap.innerHTML = t.replace(re, m => `<button type="button" class="abbr" data-key="${m}">${m}</button>`);
      node.parentNode.replaceChild(wrap, node);
    }
  };
  walk(root);
}
function showAbbr(el) {
  const tip = document.getElementById("abbrTip");
  const key = el.dataset.key || el.textContent.trim();
  const exp = GLOSSARY[key] || GLOSSARY[key.replace(/\s+/g,"")];
  if (!exp) return;
  tip.innerHTML = "<b>" + key + "</b>" + exp;
  tip.style.display = "block";
  const r = el.getBoundingClientRect();
  let left = Math.min(window.innerWidth - 260, Math.max(8, r.left));
  let top = r.bottom + 8;
  if (top + 140 > window.innerHeight) top = Math.max(8, r.top - 130);
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}
document.addEventListener("click", e => {
  const a = e.target.closest(".abbr");
  const tip = document.getElementById("abbrTip");
  if (a) { e.preventDefault(); showAbbr(a); return; }
  if (tip && !tip.contains(e.target)) tip.style.display = "none";
});
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) setTab(b.dataset.tab, document.getElementById("q").value.trim());
});
function search() {
  const active = document.querySelector(".tabs button.active")?.dataset.tab || "consulta";
  setTab(active, document.getElementById("q").value.trim());
}
document.getElementById("qb").addEventListener("click", search);
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
